name: Update dashboard

on:
  schedule:
    - cron: "7,37 8-20 * * 1-5"   # every 30 min, pre-market (4:00 ET) to the close (UTC)
    - cron: "23 22 * * 1-5"       # once after the close
  workflow_dispatch:                # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext (Congress reports)
        run: |
          which pdftotext && exit 0
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get install -y -qq --no-install-recommends poppler-utils > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils > /dev/null)
      - uses: actions/cache@v4
        with:
          path: cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: python build.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
