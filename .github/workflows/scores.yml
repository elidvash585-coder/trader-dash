name: Scores research v3

on:
  workflow_dispatch:   # Actions tab: "Scores research v3" > "Run workflow"

permissions:
  contents: write

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pandas
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Do the two scores predict? (whole US market, out of sample)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python backtest7_scores.py
      - name: Save the results in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/score_table_v3.json research/scores_v3.json research/REPORT7.md
          git commit -m "Scores research v3 results" || echo "nothing new"
          git pull --rebase
          git push
