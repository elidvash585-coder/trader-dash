name: Update dashboard

# Outside US market hours: one build per run (pre-market / after the close, every 30 min).
# During market hours (9:30-16:00 New York): each run rebuilds and redeploys every ~5 minutes for
# about an hour. A newer run (the next schedule or a push) cancels the running one, so the loop is
# continuous even when GitHub delays scheduled runs, and new code is picked up right away.
on:
  schedule:
    - cron: "7,37 8-21 * * 1-5"   # UTC; covers pre-market, the session and after hours
    - cron: "23 22 * * 1-5"       # once after the close
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext (Congress reports)
        run: |
          which pdftotext && exit 0
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get install -y -qq --no-install-recommends poppler-utils > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils > /dev/null)
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Unit tests (the site is not rebuilt if they fail)
        run: python -m unittest discover -s tests
      - name: Is the US market open now?
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, zoneinfo
          n = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          m = n.hour * 60 + n.minute
          print("open=%s" % ("true" if n.weekday() < 5 and 9 * 60 + 25 <= m < 16 * 60 + 5 else "false"))
          PY
      - name: Build (1)
        run: python build.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: site-1
      - id: d1
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-1
      - uses: actions/cache/save@v4   # saved now: a later run may cancel this one before it ends
        with:
          path: cache
          key: data-${{ github.run_id }}
      - name: Wait (2)
        if: steps.gate.outputs.open == 'true'
        run: sleep 225
      - name: Build (2)
        if: steps.gate.outputs.open == 'true'
        run: python build.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.open == 'true'
        with:
          path: site
          name: site-2
      - id: d2
        uses: actions/deploy-pages@v4
        if: steps.gate.outputs.open == 'true'
        with:
          artifact_name: site-2
      - name: Wait (3)
        if: steps.gate.outputs.open == 'true'
        run: sleep 225
      - name: Build (3)
        if: steps.gate.outputs.open == 'true'
        run: python build.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
