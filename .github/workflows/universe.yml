name: Universe backtest

on:
  workflow_dispatch:   # Actions tab: "Universe backtest" > "Run workflow"

permissions:
  contents: write

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pandas
      - name: O'Neil on the whole US market
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python backtest6_universe.py
      - name: Save the results in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/universe.json research/REPORT6.md research/rs_reference_universe.json
          git commit -m "Universe backtest results" || echo "nothing new"
          git pull --rebase
          git push
