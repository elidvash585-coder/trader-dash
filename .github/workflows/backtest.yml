name: Backtest

on:
  workflow_dispatch:   # run it from the Actions tab: "Backtest" > "Run workflow"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pandas scikit-learn
      - run: python backtest.py && python backtest2.py
      - name: Save the results in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git commit -m "Backtest results" || echo "nothing new"
          git push
